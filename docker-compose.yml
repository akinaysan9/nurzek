version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: nurzek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nurzek
      POSTGRES_USER: nurzek
      POSTGRES_PASSWORD: nurzek
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nurzek -d nurzek']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: nurzek-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
